{% extends "base.html" %}
{% block title %}Registro de Usuario{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card card-custom p-4 shadow-sm">
      <h2 class="mb-4 text-center">Registro</h2>

      <!-- Formulario tradicional -->
      <form method="POST" novalidate>
        <div class="mb-3">
          <label for="correo" class="form-label">Correo electrónico</label>
          <input type="email" name="correo" id="correo" class="form-control" placeholder="ejemplo@correo.com" required>
        </div>
        <div class="mb-3">
          <label for="usuario" class="form-label">Usuario</label>
          <input type="text" name="usuario" id="usuario" class="form-control" placeholder="Elige un usuario" required>
        </div>
        <div class="mb-4">
          <label for="contrasena" class="form-label">Contraseña</label>
          <input type="password" name="contrasena" id="contrasena" class="form-control" placeholder="Crea una contraseña" required>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 mb-3">Registrarse</button>
      </form>

      <!-- Separador visual -->
      <div class="text-center my-3 text-muted">
        <hr>
        <span class="bg-white px-2">o regístrate con</span>
      </div>

      <!-- Botones de registro social -->
      <div class="d-grid gap-2 mb-3">
        <a href="{{ url_for('google.login') }}" class="btn btn-light border d-flex align-items-center justify-content-center">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="22" class="me-2">
          Continuar con Google
        </a>

        <a href="{{ url_for('facebook.login') }}" class="btn btn-primary d-flex align-items-center justify-content-center" style="background-color:#3b5998;">
          <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook" width="22" class="me-2">
          Continuar con Facebook
        </a>
      </div>

      <div class="text-center">
        ¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión aquí</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
