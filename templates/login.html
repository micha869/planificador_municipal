{% extends "base.html" %}
{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card card-custom p-4 shadow-sm">
      <h2 class="mb-4 text-center">Iniciar Sesión</h2>

      <!-- Formulario tradicional -->
      <form method="POST" novalidate>
        <div class="mb-3">
          <label for="usuario" class="form-label">Usuario</label>
          <input type="text" name="usuario" id="usuario" class="form-control" placeholder="Tu usuario" required autofocus>
        </div>
        <div class="mb-4">
          <label for="contrasena" class="form-label">Contraseña</label>
          <input type="password" name="contrasena" id="contrasena" class="form-control" placeholder="Tu contraseña" required>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 mb-3">Entrar</button>
      </form>

      <!-- Separador visual -->
      <div class="text-center my-3 text-muted">
        <hr>
        <span class="bg-white px-2">o inicia con</span>
      </div>

      <!-- Botones de login social -->
      <div class="d-grid gap-2 mb-3">
        <a href="{{ url_for('google.login') }}" class="btn btn-light border d-flex align-items-center justify-content-center">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="22" class="me-2">
          Iniciar con Google
        </a>

        <a href="{{ url_for('facebook.login') }}" class="btn btn-primary d-flex align-items-center justify-content-center" style="background-color:#3b5998;">
          <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook" width="22" class="me-2">
          Iniciar con Facebook
        </a>
      </div>

      <div class="text-center">
        ¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate aquí</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
